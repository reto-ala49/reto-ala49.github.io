<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#061b2b">
<title>RETO ALA 49 · Centenario de los Grandes Vuelos</title>
<style>
:root{--navy:#061b2b;--navy2:#0b2c42;--gold:#f5bb4c;--gold2:#ffcf68;--text:#f8fbff;--muted:#b5c8d3;--green:#146b50}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#061b2b,#102f49);color:var(--text);font:16px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100svh}
.app{max-width:490px;min-height:100svh;margin:auto;background:linear-gradient(160deg,#092337,#061827 75%);box-shadow:0 0 50px #0005;display:flex;flex-direction:column}
header{padding:22px 18px 11px;text-align:center;background:#061a2b}header .logo{font-weight:900;letter-spacing:2px;font-size:clamp(20px,5vw,27px);line-height:1.15}header .logo:before,header .logo:after{content:'≡';font-size:25px;color:#e7eef5;padding:0 9px}header .sub{font-size:11px;letter-spacing:1.3px;color:var(--gold2);font-weight:750;margin-top:7px}
main{flex:1;padding:16px 18px 26px;display:flex;flex-direction:column}.hidden{display:none!important}
.photo{display:block;width:100%;height:215px;object-fit:cover;border-radius:12px;border:1px solid #b4c1cb22;background:#173246}.hero{height:280px;object-position:center}
.title{font-size:21px;line-height:1.23;font-weight:800;margin:17px 0}.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700}.progress{display:flex;gap:5px;margin:9px 0 15px}.progress span{height:7px;background:#315268;border-radius:9px;flex:1}.progress span.done{background:var(--gold)}
.option{width:100%;min-height:56px;margin:5px 0;padding:9px 12px;border:1px solid #42667b;border-radius:8px;background:#0d2e44;color:white;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;cursor:pointer}.option .letter{width:30px;height:30px;border:1px solid #7893a4;border-radius:5px;display:grid;place-items:center;flex-shrink:0;font-weight:700}.option.correct{background:#115e44;border-color:#76d9a4}.option.wrong{background:#63343a;border-color:#ff8e8e}.option:disabled{cursor:default;opacity:1}.mark{margin-left:auto;font-size:22px}
.feedback{margin-top:13px;padding:13px 14px;border:1px solid #398e6c;border-radius:10px;background:#134b3c}.feedback strong{color:#b7ffcd;font-size:17px}.feedback p{margin:4px 0 0;font-size:14px}
.btn{width:100%;margin-top:18px;padding:14px 12px;border:0;border-radius:10px;background:linear-gradient(180deg,#ffd16b,#e9a92f);color:#061a2b;font-weight:900;letter-spacing:.6px;font-size:15px;cursor:pointer}.btn.secondary{background:#143c57;color:white;border:1px solid #4d748b}.btn:focus-visible,.option:focus-visible{outline:3px solid #fff;outline-offset:3px}
.intro{text-align:center}.intro .strap{background:#f7d898;color:#0b2940;padding:11px 12px;max-width:340px;margin:-22px auto 20px;position:relative;transform:rotate(-1deg);font-size:22px;line-height:1.13;font-weight:900;border-radius:3px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0 16px}.features div{font-size:12px}.features b{display:block;color:var(--gold);font-size:27px;margin-bottom:5px}.intro p{color:#d1e0e8}
.result{text-align:center}.result h1{font-size:30px;margin:4px 0}.result .badge{width:min(77%,295px);height:auto;filter:drop-shadow(0 12px 13px #0009);margin:12px auto 0}.result .rank{font-size:24px;font-weight:900;color:var(--gold);margin:5px 0}.result .role{font-size:18px;font-weight:750}.result .crew{height:auto;object-fit:contain;margin:15px 0 0}.result .message{font-size:14px;color:#d1e0e8}
.small{font-size:11px;color:#9bb4c4;margin-top:15px}.footer{text-align:center;padding:13px 20px 22px;color:#95b0bf;font-size:11px}.pilot{font-size:10px;border:1px solid #668298;padding:3px 7px;border-radius:20px;display:inline-block;margin-bottom:7px}
@media(min-width:800px){body{padding:28px}.app{min-height:850px;border-radius:22px;overflow:hidden}main{min-height:700px}}

/* Portada del Volumen I: recursos originales, sin recreación de escudos */
.header-new{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:7px;align-items:center;padding:12px 10px;background:#061a2b}
.header-new .brand-symbol{display:block;width:64px;height:76px;object-fit:contain}
.header-new .brand-symbol.aviator{height:66px}
.header-new .brand-title{min-width:0}
.header-new .logo{font-size:clamp(16px,4.3vw,25px);letter-spacing:.7px;white-space:nowrap}
.header-new .logo:before,.header-new .logo:after{content:none}
.header-new .sub{font-size:9px;letter-spacing:.6px}
.intro .volume{color:var(--gold2);font-size:13px;font-weight:850;letter-spacing:3px;margin:8px 0 2px}
.intro .intro-heading{font-family:Georgia,serif;font-size:clamp(32px,8vw,43px);letter-spacing:.5px;line-height:1.1;margin:2px 0 5px}
.intro .intro-subheading{font-size:11px;font-weight:800;letter-spacing:1px;color:#dce5ed;margin:0 0 17px}
.intro .hero{width:100%;height:auto;max-height:280px;object-fit:contain;background:#e3e4e5}
.intro .strap{max-width:360px;margin:14px auto 22px;transform:none;font-size:17px;line-height:1.25;border-radius:8px}
@media(max-width:370px){.header-new{grid-template-columns:52px minmax(0,1fr) 52px}.header-new .brand-symbol{width:52px;height:64px}.header-new .brand-symbol.aviator{height:58px}.header-new .logo{font-size:16px}.header-new .sub{font-size:8px}}


/* Solo pregunta 5: mostrar el mapa completo y ligeramente más ancho, sin recortes. */
.photo-map{width:calc(100% + 16px);margin-left:-8px;height:auto;object-fit:contain}

/* ÚNICO CAMBIO DE ESTILO: cabecera de RETO ALA 49 */
.header-new{
  background:linear-gradient(180deg,#0b2a40 0%,#061a2b 100%);
  border-bottom:2px solid #dca848;
  padding:13px 12px 15px;
  gap:9px;
}
.header-new .brand-title .logo{
  font-size:clamp(18px,4.8vw,27px);
  letter-spacing:1px;
  line-height:1.15;
  text-shadow:0 1px 10px #0004;
}
.header-new .brand-title .sub{
  font-size:clamp(9px,2.15vw,11px);
  letter-spacing:.35px;
  line-height:1.35;
  margin-top:7px;
  color:#ffcf68;
  font-family:Georgia,"Palatino Linotype","Book Antiqua",serif;
  font-style:italic;
  font-weight:700;
  letter-spacing:.2px;
}
.header-new .brand-symbol.aviator{
  object-fit:contain;
}
@media(max-width:370px){
  .header-new{padding:12px 9px 14px;gap:5px}
  .header-new .brand-title .logo{font-size:17px}
  .header-new .brand-title .sub{font-size:9px}
}

/* Pantalla de resultados: botones más compactos y enlaces plegables. */
.result .btn{display:block;width:min(88%,360px);margin:9px auto 0;padding:11px 10px;min-height:43px;font-size:13px;letter-spacing:.35px}
.result .btn:first-of-type{margin-top:14px}
.more-info{margin:16px auto 2px;max-width:380px;border-top:1px solid #426078;padding-top:11px}
.more-info summary{list-style:none;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:9px;padding:10px 12px;color:var(--gold2);font-size:15px;font-weight:850;letter-spacing:.6px;border-radius:9px}
.more-info summary::-webkit-details-marker{display:none}
.more-info summary::after{content:'⌄';font-size:23px;line-height:.7;transition:transform .2s ease}
.more-info[open] summary::after{transform:rotate(180deg)}
.more-info summary:hover{background:#12354b}
.more-info summary:focus-visible{outline:3px solid #fff;outline-offset:2px}
.more-info .more-links{padding:1px 0 4px}
.more-info a{display:block;margin:8px auto;padding:10px 8px;border:1px solid #57758c;border-radius:9px;background:#10344d;color:#f8fbff;text-decoration:none;font-size:12px;font-weight:800;letter-spacing:.1px}
.more-info a:hover,.more-info a:focus-visible{border-color:var(--gold2);background:#194765;outline-offset:3px}
</style>
<style>.reto-nav{position:sticky;top:0;z-index:100;background:#092437ed;border-bottom:1px solid #b9985b66;text-align:center;padding:8px}.reto-nav a{color:#f5d693;text-decoration:none;font:700 12px system-ui;padding:8px 12px;display:inline-block}.reto-nav a:focus-visible{outline:2px solid white}</style></head>
<body><nav class="reto-nav" aria-label="Navegación"><a href="../index.html">⌂ INICIO</a><a href="../index.html?menu=1">VUELOS</a><a href="../cartilla/index.html">MI CARTILLA</a></nav><div class="app">
<header class="header-new"><img class="brand-symbol" src="assets/escudo_ala49_nitido.png" alt="Emblema del Ala 49"><div class="brand-title"><div class="logo">RETO ALA 49</div><div class="sub">CENTENARIO DE LOS GRANDES VUELOS</div></div><img class="brand-symbol aviator" src="assets/aviador_alta_calidad.png" alt="Ilustración de aviador"></header>
<main id="screen" aria-live="polite"></main>
<footer class="footer"><div>CONOCE · APRENDE · PARTICIPA</div></footer>
</div>
<script>
'use strict';
const questions=[
{q:'¿Cómo se llamaba el hidroavión que protagonizó el histórico vuelo de España a Argentina en 1926?',options:['Plus Ultra','Hispania','Numancia'],correct:0,detail:'El Plus Ultra fue un hidroavión Dornier Wal que protagonizó la travesía entre España y Argentina en 1926.'},
{q:'¿En qué país finalizó el histórico vuelo del Plus Ultra?',options:['Brasil','Argentina','México'],correct:1,detail:'El Plus Ultra llegó a Buenos Aires, Argentina, el 10 de febrero de 1926.'},
{q:'¿Quién comandó el vuelo del Plus Ultra?',options:['Juan de la Cierva','Emilio Herrera','Ramón Franco'],correct:2,detail:'Ramón Franco comandó la expedición, acompañado por Julio Ruiz de Alda, Juan Manuel Durán y Pablo Rada.'},
{q:'¿Qué tipo de aeronave era el Plus Ultra?',options:['Un hidroavión','Un helicóptero','Un avión de combate'],correct:0,detail:'Era un Dornier Wal, un hidroavión capaz de despegar y amerizar sobre el agua.'},
{q:'¿Cuántos años se cumplen en 2026 del vuelo del Plus Ultra?',options:['75 años','100 años','125 años'],correct:1,detail:'En 2026 se conmemora el centenario de la travesía del Plus Ultra, uno de los grandes hitos de la aviación española.'}
];
const levels=[{min:5,name:'ORO',role:'EXPERTO DEL ALA 49',file:'oro',color:'#ffd06c'},{min:4,name:'PLATA',role:'CONOCEDOR DEL ALA 49',file:'plata',color:'#dce6f2'},{min:3,name:'BRONCE',role:'ASPIRANTE DEL ALA 49',file:'bronce',color:'#d99a63'},{min:0,name:'CADETE',role:'PARTICIPANTE DEL RETO',file:'cadete',color:'#9ccdfb'}];
const screen=document.getElementById('screen');let index=-1,answers=[],locked=false;
function start(){index=0;answers=[];locked=false;render()}
function render(){window.scrollTo({top:0,behavior:'instant'});if(index<0){screen.innerHTML=`<section class="intro"><div class="volume">VOLUMEN I</div><h1 class="intro-heading">EL PLUS ULTRA</h1><p class="intro-subheading">LA TRAVESÍA DEL ATLÁNTICO SUR · 1926</p><img class="photo hero" src="assets/plus_ultra_historico.png" alt="Fotografía histórica del hidroavión Plus Ultra sobre el agua"><div class="strap">UN VIAJE HISTÓRICO<br>ENTRE ESPAÑA Y AMÉRICA</div><div class="features"><div><b>▤</b>5 preguntas</div><div><b>✈</b>Pon a prueba tus conocimientos</div><div><b>🏅</b>Consigue tu insignia</div></div><p>Responde, descubre la historia y gana tu insignia al finalizar.</p><button class="btn" id="start">COMENZAR RETO →</button></section>`;document.getElementById('start').onclick=start;return}
if(index>=questions.length){showResult();return}
const q=questions[index];locked=answers[index]!==undefined;screen.innerHTML=`<div class="progress-head"><span>Pregunta ${index+1} de 5</span><span>${Math.round((index+1)/5*100)}%</span></div><div class="progress" aria-label="Progreso">${questions.map((_,i)=>`<span class="${i<=index?'done':''}"></span>`).join('')}</div><img class="photo ${index===4?'photo-map':''}" src="assets/pregunta${index+1}.jpg" alt="Ilustración histórica de la aviación española"><h1 class="title">${q.q}</h1><div id="options">${q.options.map((option,i)=>`<button class="option ${locked&&i===q.correct?'correct':''} ${locked&&answers[index]===i&&i!==q.correct?'wrong':''}" data-answer="${i}" ${locked?'disabled':''}><span class="letter">${'ABC'[i]}</span><span>${option}</span>${locked&&i===q.correct?'<span class="mark">✓</span>':locked&&answers[index]===i?'<span class="mark">✕</span>':''}</button>`).join('')}</div><div id="feedback">${locked?`<div class="feedback"><strong>${answers[index]===q.correct?'✓ ¡Correcto!':'ℹ ¡Seguimos aprendiendo!'}</strong><p>${q.detail}</p></div><button class="btn" id="next">${index===4?'VER MI RESULTADO':'SIGUIENTE PREGUNTA'} →</button>`:''}</div>`;
screen.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(locked)return;answers[index]=Number(b.dataset.answer);render()});const next=document.getElementById('next');if(next)next.onclick=()=>{index++;render()};}
function getScore(){return answers.reduce((n,a,i)=>n+(a===questions[i].correct?1:0),0)}
function getLevel(){const score=getScore();return levels.find(l=>score>=l.min)}
function showResult(){const score=getScore(),l=getLevel();try{const key="reto_ala49_cartilla_2026";const r=JSON.parse(localStorage.getItem(key)||"{}");const ranks={cadete:1,bronce:2,plata:3,oro:4};if(!r[0]||ranks[l.file]>ranks[r[0]]){r[0]=l.file;localStorage.setItem(key,JSON.stringify(r));}}catch(e){}screen.innerHTML=`<section class="result"><h1>${score===5?'¡ENHORABUENA!':score===4?'¡EXCELENTE TRABAJO!':score===3?'¡BUEN VUELO!':'¡SIGUE INTENTÁNDOLO!'}</h1><div>Has acertado <strong>${score} de 5 preguntas</strong></div><img class="badge" src="assets/insignia_${l.file}.png" alt="Insignia ${l.name} del Reto Ala 49 con distintivo ${l.name}"><p class="message">${score===5?'¡Misión completada!':score===4?'¡Sigue así!':score===3?'¡Buen trabajo!':'Todo gran aviador comenzó aprendiendo. ¡Vuelve a despegar y supera tu marca!'}</p><img class="photo crew" src="assets/tripulacion_plus_ultra.png" alt="Fotografía histórica de los cuatro integrantes de la tripulación del Plus Ultra"><p class="message">Gracias por participar en el Reto Ala 49.<br>Sigamos volando juntos en la historia.</p><p class="message" style="color:#f5d693">Tu mejor insignia se ha guardado automáticamente en tu Cartilla de Vuelos.</p><a class="btn" style="display:block;text-decoration:none;background:#f5bb4c;color:#082036" href="../cartilla/index.html?vuelo=0">📖 VER MI CARTILLA DE VUELOS</a><button class="btn secondary" id="share">COMPARTIR MI INSIGNIA ↗</button><button class="btn secondary" id="download">DESCARGAR INSIGNIA ↓</button><button class="btn secondary" id="again">VOLVER A JUGAR ↻</button><div class="small">Esta insignia es un reconocimiento lúdico, no una condecoración oficial.</div><details class="more-info"><summary>¿DESEA SABER MÁS?</summary><nav class="more-links" aria-label="Enlaces para saber más"><a href="https://centenariograndesvuelos.com/" target="_blank" rel="noopener noreferrer">CENTENARIO DE LOS GRANDES VUELOS ↗</a><a href="https://ejercitodelaireydelespacio.defensa.gob.es/EA/ejercitodelaire/es/Unidades/Unidad/0583cb2e-9f2a-11ee-b1b1-005056bf91c5/#gsc.tab=0" target="_blank" rel="noopener noreferrer">CONOCE EL ALA 49 ↗</a></nav></details></section>`;document.getElementById('again').onclick=()=>{index=-1;answers=[];render()};document.getElementById('download').onclick=()=>makeResult(false);document.getElementById('share').onclick=()=>makeResult(true)}
async function makeResult(share){const l=getLevel(),score=getScore();const img=new Image();img.src=`assets/insignia_${l.file}.png`;await img.decode();const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const c=canvas.getContext('2d');const grad=c.createLinearGradient(0,0,0,1920);grad.addColorStop(0,'#123b59');grad.addColorStop(.65,'#061b2b');grad.addColorStop(1,'#112d47');c.fillStyle=grad;c.fillRect(0,0,1080,1920);c.textAlign='center';c.fillStyle='#fff';c.font='bold 80px system-ui';c.fillText('RETO ALA 49',540,190);c.font='35px system-ui';c.fillText('CENTENARIO DE LOS GRANDES VUELOS',540,260);const badgeW=740,badgeH=badgeW*img.naturalHeight/img.naturalWidth;c.drawImage(img,(1080-badgeW)/2,350,badgeW,badgeH);c.fillStyle='#fff';c.font='44px system-ui';c.fillText(`${score} de 5 respuestas correctas`,540,1400);c.fillStyle='#f2d394';c.font='bold 37px Georgia, serif';c.fillText('VOLUMEN I · EL PLUS ULTRA · 1926',540,1500);c.fillStyle='#fff';c.font='36px system-ui';c.fillText('CONOCE · APRENDE · PARTICIPA',540,1690);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob){alert('No se ha podido crear la imagen.');return}const file=new File([blob],`reto-ala49-${l.file}.png`,{type:'image/png'});if(share&&navigator.canShare?.({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:'Mi insignia RETO ALA 49',text:`He conseguido ${score}/5 aciertos en RETO ALA 49`});return}catch(e){if(e.name==='AbortError')return}}
const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=file.name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
render();
</script></body></html>
